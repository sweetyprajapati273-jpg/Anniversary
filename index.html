<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniversary Surprise Card</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fce4ec;
      background-image: radial-gradient(#f8bbd0 1.2px, transparent 1.2px);
      background-size: 18px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      perspective: 1000px;
    }

    /* Card Container with Animation */
    .card-container {
      width: 330px;
      min-height: 490px;
      position: relative;
    }

    .card {
      background: #fff;
      border: 4px solid #f8bbd0;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
      position: absolute;
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 1;
      transform: scale(1) rotateY(0deg);
    }

    /* Hide Class with Flip Effect */
    .hidden {
      opacity: 0 !important;
      transform: scale(0.8) rotateY(-90deg) !important;
      pointer-events: none !important;
      position: absolute !important;
    }

    /* Shake Animation for Errors */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-12px); }
      40%, 80% { transform: translateX(12px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    /* GIF Image Styling */
    .sticker {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 12px;
    }

    /* Keypad Styles */
    .pin-display {
      font-size: 24px;
      letter-spacing: 6px;
      height: 35px;
      color: #d81b60;
      font-weight: bold;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
      width: 100%;
    }

    .btn {
      padding: 12px;
      font-size: 17px;
      border: none;
      background: #f8bbd0;
      color: #880e4f;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s, background 0.2s;
    }

    .btn:active {
      transform: scale(0.88);
      background: #f48fb1;
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    .action-btn {
      padding: 10px 24px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.2s;
    }

    .action-btn:active {
      transform: scale(0.92);
    }

    .yes-btn { background: #ff80ab; color: white; }
    .no-btn { background: #cfd8dc; color: #37474f; }
    .retry-btn { background: #d81b60; color: white; margin-top: 15px; }

    .title {
      color: #c2185b;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card-container">

    <!-- Screen 1: Passcode -->
    <div id="screen-passcode" class="card">
      <img src="https://media.tenor.com/gU212Jy34EAAAAAi/bear-kiss-bear-hug.gif" class="sticker" alt="Cute Bears">
      <div class="title">Enter a passcode</div>
      <div id="pin-input" class="pin-display"></div>
      <div class="keypad">
        <button class="btn" onclick="press('1')">1</button>
        <button class="btn" onclick="press('2')">2</button>
        <button class="btn" onclick="press('3')">3</button>
        <button class="btn" onclick="press('4')">4</button>
        <button class="btn" onclick="press('5')">5</button>
        <button class="btn" onclick="press('6')">6</button>
        <button class="btn" onclick="press('7')">7</button>
        <button class="btn" onclick="press('8')">8</button>
        <button class="btn" onclick="press('9')">9</button>
        <button class="btn" onclick="clearPin()">C</button>
        <button class="btn" onclick="press('0')">0</button>
        <button class="btn" onclick="checkPin()">✓</button>
      </div>
    </div>

    <!-- Screen 2: Wrong Passcode -->
    <div id="screen-wrong-pass" class="card hidden">
      <img src="https://media.tenor.com/db8K_G_E4kUAAAAi/sad-bear.gif" class="sticker" alt="Sad Bear">
      <h2 style="color: #d32f2f;">WRONG PASSCODE</h2>
      <button class="action-btn retry-btn" onclick="goToScreen('screen-passcode')">TRY AGAIN</button>
    </div>

    <!-- Screen 3: Question -->
    <div id="screen-question" class="card hidden">
      <img src="https://media.tenor.com/6X2Bchx5-9sAAAAi/cute-bear.gif" class="sticker" alt="Special Present">
      <div class="title">I made something special for u ❤️</div>
      <p style="color: #880e4f; font-weight: bold;">do u wanna see it?</p>
      <div class="btn-group">
        <button class="action-btn yes-btn" onclick="goToScreen('screen-wish')">YES</button>
        <button class="action-btn no-btn" onclick="goToScreen('screen-wrong-no')">NO</button>
      </div>
    </div>

    <!-- Screen 4: Clicked NO Warning -->
    <div id="screen-wrong-no" class="card hidden">
      <img src="https://media.tenor.com/N2938vHk9dIAAAAi/peach-cat-crying.gif" class="sticker" alt="Angry Crying Bear">
      <h3 style="color: #c2185b; margin-bottom: 10px;">Why did u click no?! 🥺</h3>
      <button class="action-btn retry-btn" onclick="goToScreen('screen-question')">TRY AGAIN</button>
    </div>

    <!-- Screen 5: Final Wish Page -->
    <div id="screen-wish" class="card hidden">
      <img src="https://media.tenor.com/vH1Wf46z17sAAAAi/hug-bear.gif" class="sticker" alt="Love Hug">
      <h2 style="color: #c2185b;">HAPPY ANNIVERSARY MY LOVE! ❤️</h2>
      <p style="color: #880e4f; font-size: 14px; margin-top: 10px;">You are my favorite person in the whole world! ✨</p>
    </div>

  </div>

  <script>
    const CORRECT_PIN = "1234"; // Yahan passcode set karein
    let currentInput = "";

    function press(num) {
      if (currentInput.length < 4) {
        currentInput += num;
        document.getElementById('pin-input').innerText = "*".repeat(currentInput.length);
      }
    }

    function clearPin() {
      currentInput = "";
      document.getElementById('pin-input').innerText = "";
    }

    function checkPin() {
      if (currentInput === CORRECT_PIN) {
        goToScreen('screen-question');
      } else {
        const passCard = document.getElementById('screen-passcode');
        passCard.classList.add('shake');
        setTimeout(() => {
          passCard.classList.remove('shake');
          goToScreen('screen-wrong-pass');
        }, 350);
      }
      clearPin();
    }

    function goToScreen(screenId) {
      const screens = document.querySelectorAll('.card');
      screens.forEach(s => s.classList.add('hidden'));

      setTimeout(() => {
        const target = document.getElementById(screenId);
        target.classList.remove('hidden');
      }, 150);
    }
  </script>
</body>
  </html>
